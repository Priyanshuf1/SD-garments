name: ALLYRICH DevOps CI/CD Pipeline

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  # ============================================================================
  # STAGE 1: Automated Testing & Security Verification
  # ============================================================================
  test-and-verify:
    name: Run Automated Security & Compliance Tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Codebase
        uses: actions/checkout@v4

      - name: Setup Node.js Runtime (v20)
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install Project Dependencies
        run: npm ci

      - name: Test Legal & Compliance Policies (DPDP Act, Terms, Refunds)
        run: node test_legal_policies.js

      - name: Test Security & Abuse Controls (Rate Limiting, Brute Force, SSRF)
        run: node test_security_abuse_controls.js

      - name: Test Production Logistics, OTP, and n8n Webhook Pipeline
        run: node test_complete_fixes.js

      - name: Test D2C Features & 60 FPS Performance Optimizations
        run: node test_d2c_performance.js

      - name: Test Product Page Rendering & Customer Detail Persistence
        run: node test_product_and_account_fixes.js

  # ============================================================================
  # STAGE 2: Multi-Stage Docker Container Build & Health Verification
  # ============================================================================
  docker-build-and-scan:
    name: Build Docker Container & Scan Vulnerabilities
    needs: test-and-verify
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Codebase
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Docker Container Image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./Dockerfile
          push: false
          load: true
          tags: allyrich-app:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Verify Container Health Check
        run: |
          docker run -d --name test-allyrich -p 3000:3000 allyrich-app:${{ github.sha }}
          echo "Waiting 5 seconds for container startup..."
          sleep 5
          curl --fail http://localhost:3000/api/health || (docker logs test-allyrich && exit 1)
          echo "Healthcheck successfully verified on port 3000!"
          docker stop test-allyrich

      - name: Run Trivy Vulnerability Scan (DevSecOps)
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: 'allyrich-app:${{ github.sha }}'
          format: 'table'
          exit-code: '0' # Don't break build on minor base OS warnings, report findings
          ignore-unfixed: true
          vuln-type: 'os,library'
          severity: 'CRITICAL,HIGH'

  # ============================================================================
  # STAGE 3: Automated Production Deployment to AWS EC2
  # ============================================================================
  deploy-to-ec2:
    name: Deploy Container to AWS EC2 Production
    needs: docker-build-and-scan
    if: github.ref == 'refs/heads/main' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
    runs-on: ubuntu-latest

    steps:
      - name: Deploy to EC2 via SSH
        uses: appleboy/ssh-action@v1.0.3
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          N8N_ORDER_WEBHOOK_URL: ${{ secrets.N8N_ORDER_WEBHOOK_URL }}
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
          BREVO_API_KEY: ${{ secrets.BREVO_API_KEY }}
          DB_NAME: ${{ secrets.DB_NAME }}
          DB_USER: ${{ secrets.DB_USER }}
          DB_PASSWORD: ${{ secrets.DB_PASSWORD }}
          CASHFREE_APP_ID: ${{ secrets.CASHFREE_APP_ID }}
          CASHFREE_SECRET_KEY: ${{ secrets.CASHFREE_SECRET_KEY }}
          ADMIN_SECRET_KEY: ${{ secrets.ADMIN_SECRET_KEY }}
          ADMIN_USERNAME: ${{ secrets.ADMIN_USERNAME }}
          ADMIN_PASSWORD: ${{ secrets.ADMIN_PASSWORD }}
          ADMIN_2FA_SECRET: ${{ secrets.ADMIN_2FA_SECRET }}
          AUTH_SESSION_SECRET: ${{ secrets.AUTH_SESSION_SECRET }}
          DELHIVERY_API_TOKEN: ${{ secrets.DELHIVERY_API_TOKEN }}
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          envs: GEMINI_API_KEY,N8N_ORDER_WEBHOOK_URL,RESEND_API_KEY,BREVO_API_KEY,DB_NAME,DB_USER,DB_PASSWORD,CASHFREE_APP_ID,CASHFREE_SECRET_KEY,ADMIN_SECRET_KEY,ADMIN_USERNAME,ADMIN_PASSWORD,ADMIN_2FA_SECRET,AUTH_SESSION_SECRET,DELHIVERY_API_TOKEN
          script: |
            cd ~/SD-garments
            mkdir -p ~/SD-garments-data-backup
            # Backup transactional user records only (never overwrite catalog products/collections)
            for f in orders.json customers.json subscribers.json reviews.json discounts.json; do
              [ -f "data/$f" ] && cp -f "data/$f" ~/SD-garments-data-backup/"$f" 2>/dev/null || true
            done
            git fetch origin main
            git reset --hard origin/main
            # Restore transactional user records only
            for f in orders.json customers.json subscribers.json reviews.json discounts.json; do
              [ -f ~/SD-garments-data-backup/"$f" ] && cp -f ~/SD-garments-data-backup/"$f" "data/$f" 2>/dev/null || true
            done
            [ -f .env ] || touch .env
            write_env() { sed -i "/^$1=/d" .env; printf '%s=%s\n' "$1" "$2" >> .env; }
            if [ -n "$GEMINI_API_KEY" ]; then
              write_env GEMINI_API_KEY "$GEMINI_API_KEY"
            fi
            [ -z "$N8N_ORDER_WEBHOOK_URL" ] || write_env N8N_ORDER_WEBHOOK_URL "$N8N_ORDER_WEBHOOK_URL"
            [ -z "$RESEND_API_KEY" ] || write_env RESEND_API_KEY "$RESEND_API_KEY"
            [ -z "$BREVO_API_KEY" ] || write_env BREVO_API_KEY "$BREVO_API_KEY"
            write_env DB_NAME "${DB_NAME:-alleyrich_production}"
            write_env DB_USER "${DB_USER:-alleyrich_admin}"
            write_env DB_PASSWORD "${DB_PASSWORD:-AlleyRichSecurePass2026}"
            [ -z "$CASHFREE_APP_ID" ] || write_env CASHFREE_APP_ID "$CASHFREE_APP_ID"
            [ -z "$CASHFREE_SECRET_KEY" ] || write_env CASHFREE_SECRET_KEY "$CASHFREE_SECRET_KEY"
            write_env ADMIN_SECRET_KEY "${ADMIN_SECRET_KEY:-genrage_super_admin_secret_key_2026}"
            write_env ADMIN_USERNAME "${ADMIN_USERNAME:-Deepak_is_admin}"
            write_env ADMIN_PASSWORD "${ADMIN_PASSWORD:-#99882211@}"
            write_env ADMIN_2FA_SECRET "${ADMIN_2FA_SECRET:-4I543GYJL7LAMAC7UPPL}"
            write_env AUTH_SESSION_SECRET "${AUTH_SESSION_SECRET:-alleyrich_super_secret_auth_session_key_2026}"
            write_env DELHIVERY_API_TOKEN "${DELHIVERY_API_TOKEN:-5b89b0734b0d4daa1655ea178e432c33f1964d80}"
            write_env APP_DOMAIN "alleyrich.com"
            sed -i '/^DELHIVERY_WAREHOUSE_NAME=/d' .env
            echo "DELHIVERY_WAREHOUSE_NAME=SD Garments" >> .env
            sed -i '/^DELHIVERY_WAREHOUSE_PINCODE=/d' .env
            echo "DELHIVERY_WAREHOUSE_PINCODE=209721" >> .env
            sed -i '/^DELHIVERY_WAREHOUSE_ADDRESS=/d' .env
            echo "DELHIVERY_WAREHOUSE_ADDRESS=1 SD Garments, nagar palika road, chhibramau" >> .env
            sed -i '/^DELHIVERY_CLIENT_NAME=/d' .env
            echo "DELHIVERY_CLIENT_NAME=SD Garments" >> .env
            sed -i '/^DELHIVERY_ENV=/d' .env
            echo "DELHIVERY_ENV=production" >> .env
            sed -i '/^BREVO_API_KEY=/d' .env
            echo "BREVO_API_KEY=${BREVO_API_KEY:-}" >> .env
            sed -i '/^BREVO_SENDER_EMAIL=/d' .env
            echo "BREVO_SENDER_EMAIL=support@allyrich.com" >> .env
            sed -i '/^N8N_OTP_WEBHOOK_URL=/d' .env
            echo "N8N_OTP_WEBHOOK_URL=${N8N_OTP_WEBHOOK_URL:-}" >> .env
            # Cleanly stop and remove any old/orphan containers to prevent port collisions
            sudo docker compose down --remove-orphans || true
            sudo docker stop allyrich-web allyrich-db alleyrich-storefront alleyrich-db 2>/dev/null || true
            sudo docker rm allyrich-web allyrich-db alleyrich-storefront alleyrich-db 2>/dev/null || true
            sudo docker compose build --no-cache web
            sudo docker compose up -d --remove-orphans
            echo "Waiting for services to initialize..."
            sleep 10
            curl --fail http://localhost:3000/api/health || curl --fail http://localhost/api/health || exit 1
            curl --fail http://localhost:3000/pages/track-order.html || curl --fail http://localhost/pages/track-order.html || exit 1
            echo "🚀 Deployment successfully verified on AWS EC2!"
