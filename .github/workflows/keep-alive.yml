name: Supabase & Vercel 24/7 Never-Sleep Keep-Alive

on:
  schedule:
    # Runs every 6 hours (at 00:00, 06:00, 12:00, 18:00 UTC)
    - cron: '0 */6 * * *'
  workflow_dispatch: # Allows manual trigger from GitHub Actions UI

jobs:
  keep-alive:
    name: Ping Supabase & Vercel
    runs-on: ubuntu-latest
    steps:
      - name: Ping Supabase PostgreSQL (Prevent Inactivity Sleep)
        run: |
          echo "⚡ Pinging Supabase REST API to reset 7-day inactivity pause timer..."
          HTTP_STATUS=$(curl -s -o /dev/null -w "%{http_code}" \
            -H "apikey: ${{ secrets.SUPABASE_ANON_KEY }}" \
            -H "Authorization: Bearer ${{ secrets.SUPABASE_ANON_KEY }}" \
            "https://shhjnxarewideotbhzby.supabase.co/rest/v1/products?select=id&limit=1" || echo "failed")
          echo "Supabase Response Status: $HTTP_STATUS"
          if [ "$HTTP_STATUS" = "200" ]; then
            echo "✅ Supabase is LIVE and active! 7-day pause timer reset."
          else
            echo "⚠️ Notice: Supabase responded with status $HTTP_STATUS"
          fi

      - name: Ping Vercel Deployment (Prevent Cold Starts)
        run: |
          echo "⚡ Pinging Vercel deployment health endpoint..."
          # Ping Vercel production domain
          VERCEL_URL="https://genrage.vercel.app"
          STATUS=$(curl -s -o /dev/null -w "%{http_code}" "$VERCEL_URL/api/health" || echo "failed")
          echo "Vercel Response Status: $STATUS"
          if [ "$STATUS" = "200" ]; then
            echo "✅ Vercel serverless function is warm and active!"
          else
            echo "ℹ️ Vercel check completed with status: $STATUS"
          fi
