name: ALLEYRICH 24/7 Production & Database Health Keep-Alive

on:
  schedule:
    # Runs every 6 hours (at 00:00, 06:00, 12:00, 18:00 UTC)
    - cron: '0 */6 * * *'
  workflow_dispatch: # Allows manual trigger from GitHub Actions UI

jobs:
  keep-alive:
    name: Ping Database & Production Origin
    runs-on: ubuntu-latest
    steps:
      - name: Ping Supabase PostgreSQL (Prevent Inactivity Sleep)
        run: |
          echo "⚡ Pinging Supabase REST API to reset 7-day inactivity pause timer..."
          HTTP_STATUS=$(curl -s -o /dev/null -w "%{http_code}" \
            -H "apikey: ${{ secrets.SUPABASE_ANON_KEY }}" \
            -H "Authorization: Bearer ${{ secrets.SUPABASE_ANON_KEY }}" \
            "https://shhjnxarewideotbhzby.supabase.co/rest/v1/products?select=id&limit=1" || echo "failed")
          echo "Supabase Response Status: $HTTP_STATUS"
          if [ "$HTTP_STATUS" = "200" ]; then
            echo "✅ Supabase PostgreSQL is LIVE and active! 7-day pause timer reset."
          else
            echo "⚠️ Notice: Supabase responded with status $HTTP_STATUS"
          fi

      - name: Ping ALLEYRICH AWS EC2 Production (Cloudflare CDN Edge)
        run: |
          echo "⚡ Pinging ALLEYRICH production health endpoint..."
          PROD_URL="https://alleyrich.com"
          STATUS=$(curl -s -o /dev/null -w "%{http_code}" "$PROD_URL/api/health" || echo "failed")
          echo "ALLEYRICH Production Response Status: $STATUS"
          if [ "$STATUS" = "200" ]; then
            echo "✅ ALLEYRICH AWS EC2 container origin & Cloudflare edge are healthy!"
          else
            echo "ℹ️ ALLEYRICH check completed with status: $STATUS"
          fi
