<!DOCTYPE html>
<html lang="en" dir="ltr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Order Confirmed | ALLYRICH Official Store</title>
  <link rel="shortcut icon" href="/assets/ar-logo.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Instrument+Sans:wght@400;600;700;800&family=Nunito:wght@400;600;700;800&family=Shippori+Mincho+B1:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/assets/css/theme.css">
  <link rel="stylesheet" href="/assets/css/custom.css">
  <link rel="stylesheet" href="/assets/css/allyrich.css">
  <style>
    body {
      background: #f7f7f7;
      color: #111;
      font-family: 'Nunito', sans-serif;
      margin: 0;
      padding: 0;
    }
    .header-bar {
      background: #fff;
      border-bottom: 1px solid #e5e5e5;
      padding: 1rem 2rem;
      text-align: center;
    }
    .success-card {
      max-width: 580px;
      margin: 3.5rem auto;
      padding: 2.5rem;
      background: #fff;
      border: 1px solid #e5e5e5;
      border-radius: 6px;
      text-align: center;
      box-shadow: 0 10px 30px rgba(0,0,0,0.05);
    }
    .check-circle {
      width: 64px;
      height: 64px;
      background: #e8f5e9;
      color: #2e7d32;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 2rem;
      margin: 0 auto 1.25rem;
    }
  </style>
</head>
<body>

  <header class="header-bar">
    <a href="/" class="allyrich-header-brand allyrich-header-brand--dark" aria-label="AllyRich Home">
      <img src="/assets/ar-logo.png" alt="AR" class="allyrich-header-logo-img" width="28" height="35">
      <span class="allyrich-header-brand-name">ALLYRICH</span>
    </a>
  </header>

  <main style="padding: 0 1.5rem;">
    <div class="success-card">
      <div class="check-circle">✓</div>
      <h1 style="font-family:'Shippori Mincho B1', serif; font-size:1.75rem; font-weight:600; letter-spacing:0.18em; text-transform:uppercase; margin:0 0 8px;">Order Confirmed!</h1>
      <p style="color:#666; font-size:0.95rem; margin:0 0 1.5rem;">Thank you for shopping with ALLYRICH. We're packing your drop.</p>

      <div style="background:#f9f9f9; border:1px solid #eee; border-radius:4px; padding:1.25rem; margin-bottom:1.75rem; text-align:left;">
        <div style="display:flex; justify-content:space-between; margin-bottom:8px;">
          <span style="color:#666; font-size:0.85rem;">Order Number</span>
          <strong id="display-order-id" style="font-family:'Instrument Sans', sans-serif; font-size:1rem;">GR-XXXX</strong>
        </div>
        <div style="display:flex; justify-content:space-between; margin-bottom:8px;">
          <span style="color:#666; font-size:0.85rem;">Carrier & Dispatch</span>
          <strong style="color:#2e7d32; font-size:0.85rem;">Delhivery Express Air Delivery</strong>
        </div>
        <div style="display:flex; justify-content:space-between;">
          <span style="color:#666; font-size:0.85rem;">Estimated Arrival</span>
          <span style="font-size:0.85rem; font-weight:700;">2 - 4 Business Days</span>
        </div>
      </div>

      <div style="display:flex; flex-direction:column; gap:10px; margin-bottom: 0.5rem;">
        <a id="btn-track-delhivery" href="/pages/track-order.html" style="background:#000; color:#fff; text-decoration:none; padding:13px; font-weight:800; font-size:0.85rem; letter-spacing:0.05em; text-transform:uppercase; border-radius:3px; display:block; text-align:center;">TRACK SHIPMENT LIVE ➔</a>
        <a id="btn-whatsapp-updates" href="https://wa.me/919876543210?text=Hi%20ALLYRICH,%20please%20send%20live%20WhatsApp%20updates" target="_blank" rel="noopener" style="background:#25D366; color:#000; text-decoration:none; padding:13px; font-weight:800; font-size:0.85rem; letter-spacing:0.05em; text-transform:uppercase; border-radius:3px; display:flex; align-items:center; justify-content:center; gap:8px;">
          <span>💬 GET LIVE UPDATES ON WHATSAPP</span>
        </a>
        <div style="display:flex; gap:10px; justify-content:center; margin-top:4px;">
          <a href="/account" style="flex:1; background:#f0f0f0; color:#111; text-decoration:none; padding:12px; font-weight:800; font-size:0.8rem; text-transform:uppercase; border-radius:3px;">VIEW MY ACCOUNT</a>
          <a href="/collections/shop" style="flex:1; background:#f0f0f0; color:#111; text-decoration:none; padding:12px; font-weight:800; font-size:0.8rem; text-transform:uppercase; border-radius:3px;">CONTINUE SHOPPING</a>
        </div>
      </div>
    </div>
  </main>

  <script>
    const params = new URLSearchParams(window.location.search);
    const orderId = params.get('orderId') || 'GR-1001';
    document.getElementById('display-order-id').textContent = orderId;
    const trackBtn = document.getElementById('btn-track-delhivery');
    if (trackBtn && orderId) {
      trackBtn.href = '/pages/track-order.html?order=' + encodeURIComponent(orderId);
    }
    const waBtn = document.getElementById('btn-whatsapp-updates');
    if (waBtn && orderId) {
      waBtn.href = 'https://wa.me/919876543210?text=' + encodeURIComponent('Hi ALLYRICH, please send live WhatsApp delivery updates for order #' + orderId + '.');
    }
  </script>
</body>
</html>
