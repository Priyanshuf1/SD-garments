<!DOCTYPE html>
<html lang="en" dir="ltr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>My Account | GENRAGE Official Store</title>
  <link rel="shortcut icon" href="//genrage.com/cdn/shop/files/GENRAGE.png?v=1736145362&width=96">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Instrument+Sans:wght@400;600;700;800&family=Nunito:wght@400;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/assets/css/theme.css">
  <link rel="stylesheet" href="/assets/css/custom.css">
  <style>
    body {
      background: #f7f7f7;
      color: #111;
      font-family: 'Nunito', sans-serif;
      margin: 0;
      padding: 0;
    }
    .header-bar {
      background: #fff;
      border-bottom: 1px solid #e5e5e5;
      padding: 1rem 2rem;
      display: flex;
      align-items: center;
      justify-content: space-between;
    }
    .account-wrapper {
      max-width: 1100px;
      margin: 2.5rem auto;
      padding: 0 1.5rem;
    }
    .profile-card {
      background: #fff;
      border: 1px solid #e5e5e5;
      border-radius: 4px;
      padding: 2rem;
      margin-bottom: 2rem;
      display: flex;
      justify-content: space-between;
      align-items: center;
      flex-wrap: wrap;
      gap: 1.5rem;
    }
    .tabs-nav {
      display: flex;
      gap: 1.5rem;
      border-bottom: 2px solid #e5e5e5;
      margin-bottom: 1.5rem;
    }
    .tab-btn {
      background: none;
      border: none;
      padding: 10px 0;
      font-family: 'Instrument Sans', sans-serif;
      font-size: 0.95rem;
      font-weight: 800;
      text-transform: uppercase;
      letter-spacing: 0.04em;
      cursor: pointer;
      color: #777;
      position: relative;
    }
    .tab-btn.active {
      color: #000;
    }
    .tab-btn.active::after {
      content: '';
      position: absolute;
      bottom: -2px;
      left: 0;
      right: 0;
      height: 2px;
      background: #000;
    }
    .order-box {
      background: #fff;
      border: 1px solid #e5e5e5;
      border-radius: 4px;
      padding: 1.5rem;
      margin-bottom: 1.25rem;
    }
    .status-badge {
      display: inline-block;
      padding: 3px 8px;
      border-radius: 99px;
      font-size: 0.75rem;
      font-weight: 800;
      text-transform: uppercase;
    }
    .status-shipped { background: #e3f2fd; color: #1565c0; }
    .status-delivered { background: #e8f5e9; color: #2e7d32; }
    .status-processing { background: #fff3e0; color: #e65100; }
    .wishlist-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(220px, 1fr));
      gap: 1.5rem;
    }
    .wishlist-card {
      background: #fff;
      border: 1px solid #e5e5e5;
      border-radius: 4px;
      overflow: hidden;
      display: flex;
      flex-direction: column;
    }
    .wishlist-card img {
      width: 100%;
      aspect-ratio: 3/4;
      object-fit: cover;
    }
    .wishlist-card-content {
      padding: 1rem;
      flex: 1;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
    }
  </style>
</head>
<body>

  <header class="header-bar">
    <a href="/collections/shop" style="text-decoration:none; color:#111; font-weight:700; font-size:0.85rem;">
      ← Continue Shopping
    </a>
    <a href="/">
      <img src="//genrage.com/cdn/shop/files/logo.png?v=1716806780&width=2800" alt="GENRAGE" style="height:26px; filter: brightness(0);">
    </a>
    <button onclick="AuthEngine.logout()" style="background:none; border:1px solid #ccc; padding:6px 14px; border-radius:2px; font-weight:700; font-size:0.8rem; cursor:pointer;">
      Sign Out
    </button>
  </header>

  <main class="account-wrapper">
    
    <!-- User Profile Header -->
    <div class="profile-card">
      <div>
        <span style="background:#000; color:#fff; font-size:0.7rem; font-weight:800; padding:2px 8px; border-radius:2px; text-transform:uppercase;">VIP MEMBER</span>
        <h1 id="user-display-name" style="font-family:'Instrument Sans', sans-serif; font-size:1.85rem; font-weight:800; text-transform:uppercase; margin:8px 0 4px;">Loading Account...</h1>
        <div id="user-display-email" style="color:#666; font-size:0.9rem;"></div>
        <div id="user-display-phone" style="color:#888; font-size:0.85rem; margin-top:2px;"></div>
      </div>
      <div>
        <div style="font-size:0.8rem; color:#666; text-transform:uppercase; font-weight:700;">Default Shipping Address</div>
        <div id="user-display-address" style="font-size:0.9rem; font-weight:600; margin-top:2px; max-width:280px;">Mumbai, Maharashtra, India</div>
      </div>
    </div>

    <!-- Navigation Tabs -->
    <div class="tabs-nav">
      <button class="tab-btn active" id="tab-orders" onclick="switchAccountTab('orders')">Orders History</button>
      <button class="tab-btn" id="tab-wishlist" onclick="switchAccountTab('wishlist')">Saved Wishlist (<span id="tab-wishlist-count">0</span>)</button>
    </div>

    <!-- Orders Section -->
    <section id="section-orders">
      <div id="orders-list-container">
        <div style="text-align:center; padding:3rem; color:#888;">Loading your order history...</div>
      </div>
    </section>

    <!-- Wishlist Section -->
    <section id="section-wishlist" style="display:none;">
      <div id="wishlist-list-container" class="wishlist-grid">
        <!-- Rendered items -->
      </div>
    </section>

  </main>

  <script src="/assets/js/wishlist.js"></script>
  <script src="/assets/js/auth.js"></script>
  <script>
    let currentUser = null;

    async function initAccount() {
      try {
        currentUser = window.AuthEngine?.getUser?.();
        if (!currentUser) {
          const raw = localStorage.getItem('genrage_user');
          if (raw) {
            try { currentUser = JSON.parse(raw); } catch (e) {}
          }
        }

        const token = window.AuthEngine?.getToken?.() || localStorage.getItem('genrage_token');
        if (!currentUser && token) {
          try {
            const res = await fetch('/api/auth/me', {
              headers: { 'Authorization': `Bearer ${token}` }
            });
            const data = await res.json();
            if (data.success && data.user) {
              currentUser = data.user;
              localStorage.setItem('genrage_user', JSON.stringify(currentUser));
            }
          } catch (e) {}
        }

        if (!currentUser) {
          const nameEl = document.getElementById('user-display-name');
          if (nameEl) nameEl.textContent = 'Sign In to Access Account';
          const container = document.getElementById('orders-list-container');
          if (container) {
            container.innerHTML = `
              <div style="background:#fff; border:1px solid #e5e5e5; border-radius:4px; padding:3rem 1.5rem; text-align:center; color:#555;">
                <h3 style="margin:0 0 8px; text-transform:uppercase;">Sign In Required</h3>
                <p style="font-size:0.85rem; margin-bottom:1.5rem; color:#777;">Please log in or register to view your order history and saved items.</p>
                <a href="/login" style="background:#000; color:#fff; text-decoration:none; padding:12px 24px; font-weight:800; font-size:0.85rem; text-transform:uppercase; border-radius:2px; display:inline-block;">GO TO LOGIN</a>
              </div>
            `;
          }
          setTimeout(() => {
            if (!localStorage.getItem('genrage_user')) {
              window.location.href = '/login';
            }
          }, 1500);
          return;
        }

        const nameEl = document.getElementById('user-display-name');
        if (nameEl) nameEl.textContent = currentUser.name || currentUser.full_name || 'Storefront Member';

        const emailEl = document.getElementById('user-display-email');
        if (emailEl) emailEl.textContent = currentUser.email || '';

        const phoneEl = document.getElementById('user-display-phone');
        if (phoneEl) phoneEl.textContent = currentUser.phone || '';

        const addrEl = document.getElementById('user-display-address');
        if (addrEl) {
          const addrParts = [currentUser.address, currentUser.city, currentUser.state, currentUser.pincode].filter(Boolean);
          addrEl.textContent = addrParts.length > 0 ? addrParts.join(', ') : 'Mumbai, Maharashtra, India';
        }

        await Promise.allSettled([loadOrders(), loadWishlist()]);
      } catch (err) {
        console.error('Account init error:', err);
        const nameEl = document.getElementById('user-display-name');
        if (nameEl) nameEl.textContent = 'Account Member';
      }
    }

    async function loadOrders() {
      const container = document.getElementById('orders-list-container');
      if (!container) return;

      try {
        const email = (currentUser?.email || '').trim();
        const phone = (currentUser?.phone || '').trim();
        const userId = (currentUser?.id || '').trim();

        const queryParams = new URLSearchParams();
        if (email) queryParams.set('email', email);
        if (phone) queryParams.set('phone', phone);
        if (userId) queryParams.set('userId', userId);

        let orders = [];
        try {
          const res = await fetch(`/api/orders?${queryParams.toString()}`);
          if (res.ok) {
            const data = await res.json();
            orders = Array.isArray(data.orders) ? data.orders : [];
          }
        } catch (e) {
          try {
            const res2 = await fetch(`/api/auth/orders?${queryParams.toString()}`);
            if (res2.ok) {
              const data2 = await res2.json();
              orders = Array.isArray(data2.orders) ? data2.orders : [];
            }
          } catch (e2) {}
        }

        if (orders.length === 0) {
          container.innerHTML = `
            <div style="background:#fff; border:1px solid #e5e5e5; border-radius:4px; padding:3rem; text-align:center; color:#777;">
              <h3 style="margin:0 0 8px; text-transform:uppercase;">No Orders Yet</h3>
              <p style="font-size:0.85rem; margin-bottom:1.5rem;">Explore our latest oversized drop to start your collection.</p>
              <a href="/collections/shop" style="background:#000; color:#fff; text-decoration:none; padding:10px 20px; font-weight:800; font-size:0.85rem; text-transform:uppercase; border-radius:2px;">SHOP NEW ARRIVALS</a>
            </div>
          `;
          return;
        }

        container.innerHTML = orders.map(o => {
          let badgeClass = 'status-processing';
          if (o.orderStatus === 'Shipped') badgeClass = 'status-shipped';
          if (o.orderStatus === 'Delivered') badgeClass = 'status-delivered';

          const itemsList = Array.isArray(o.items) && o.items.length > 0 ? o.items : [{
            title: 'Streetwear Apparel',
            quantity: 1,
            price: o.total || 1899,
            image: 'https://cdn.shopify.com/s/files/1/0633/9339/9022/files/1_cd34702d-ac3b-4ee4-a9d4-1733e518d430.png?v=1792222977'
          }];

          const itemsHtml = itemsList.map(i => `
            <div style="display:flex; align-items:center; gap:12px; margin-top:8px;">
              <img src="${i.image || 'https://cdn.shopify.com/s/files/1/0633/9339/9022/files/1_cd34702d-ac3b-4ee4-a9d4-1733e518d430.png?v=1792222977'}" style="width:40px; height:50px; object-fit:cover; border-radius:2px; background:#f0f0f0;">
              <div style="flex:1; font-size:0.85rem;">
                <strong>${i.title}</strong>
                <span style="color:#666;">(Qty: ${i.quantity || 1})</span>
              </div>
              <div style="font-weight:700; font-size:0.85rem;">Rs. ${(Number(i.price) || 1899).toLocaleString('en-IN')}</div>
            </div>
          `).join('');

          return `
            <div class="order-box">
              <div style="display:flex; justify-content:space-between; align-items:center; border-bottom:1px solid #eee; padding-bottom:10px; margin-bottom:12px; flex-wrap:wrap; gap:8px;">
                <div>
                  <strong style="font-family:'Instrument Sans', sans-serif; font-size:1.05rem;">Order #${o.id}</strong>
                  <span style="font-size:0.75rem; color:#888; margin-left:8px;">${new Date(o.createdAt || Date.now()).toLocaleDateString('en-IN', { day: 'numeric', month: 'short', year: 'numeric' })}</span>
                </div>
                <div style="display:flex; align-items:center; gap:10px;">
                  <span class="status-badge ${badgeClass}">${o.orderStatus || 'Processing'}</span>
                  <strong style="font-size:1rem;">Rs. ${(Number(o.total) || 1899).toLocaleString('en-IN')}</strong>
                </div>
              </div>

              ${itemsHtml}

              <div style="display:flex; justify-content:space-between; align-items:center; border-top:1px solid #f0f0f0; padding-top:10px; margin-top:12px; font-size:0.8rem; color:#666; flex-wrap:wrap; gap:8px;">
                <div>
                  Payment: <strong>${o.paymentMethod || 'Prepaid UPI'}</strong> (${o.paymentStatus || 'Paid'})
                </div>
                <div>
                  ${o.trackingNumber ? `
                    Delhivery AWB: <a href="https://www.delhivery.com/track/package/${o.trackingNumber}" target="_blank" style="color:#1565c0; font-weight:700; text-decoration:none;">${o.trackingNumber} ↗</a>
                  ` : '<span style="color:#888;">Express dispatch in progress</span>'}
                </div>
              </div>
            </div>
          `;
        }).join('');

      } catch (e) {
        container.innerHTML = '<div style="color:#c00; text-align:center; padding:2rem;">Could not load orders. Please refresh.</div>';
      }
    }

    async function loadWishlist() {
      const container = document.getElementById('wishlist-list-container');
      if (!container) return;
      const list = window.WishlistEngine ? window.WishlistEngine.getWishlist() : [];
      const badge = document.getElementById('tab-wishlist-count');
      if (badge) badge.textContent = list.length;

      if (list.length === 0) {
        container.innerHTML = `
          <div style="grid-column: 1/-1; background:#fff; border:1px solid #e5e5e5; border-radius:4px; padding:3rem; text-align:center; color:#777;">
            <h3 style="margin:0 0 8px; text-transform:uppercase;">Your Wishlist is Empty</h3>
            <p style="font-size:0.85rem; margin-bottom:1.5rem;">Tap the heart icon on any drop to save items here.</p>
            <a href="/collections/shop" style="background:#000; color:#fff; text-decoration:none; padding:10px 20px; font-weight:800; font-size:0.85rem; text-transform:uppercase; border-radius:2px;">DISCOVER DROPS</a>
          </div>
        `;
        return;
      }

      let products = [];
      try {
        const res = await fetch('/api/products');
        const data = await res.json();
        products = data.products || [];
      } catch (e) {}

      container.innerHTML = list.map(item => {
        const handle = typeof item === 'string' ? item : item.handle;
        const prod = products.find(p => p.handle === handle) || (typeof item === 'object' ? item : { title: handle, handle });
        const img = prod.images?.[0]?.src || prod.image || 'https://cdn.shopify.com/s/files/1/0633/9339/9022/files/1_cd34702d-ac3b-4ee4-a9d4-1733e518d430.png?v=1792222977';
        const price = prod.variants?.[0]?.price || prod.price || '1899';

        return `
          <div class="wishlist-card">
            <a href="/products/${handle}"><img src="${img}" alt="${prod.title || handle}"></a>
            <div class="wishlist-card-content">
              <div>
                <a href="/products/${handle}" style="text-decoration:none; color:#111; font-weight:700; font-size:0.85rem; display:block; margin-bottom:4px;">${prod.title || handle}</a>
                <div style="font-weight:800; font-size:0.9rem; margin-bottom:1rem;">Rs. ${Number(price).toLocaleString('en-IN')}</div>
              </div>
              <div style="display:flex; gap:6px;">
                <a href="/products/${handle}" style="flex:1; background:#000; color:#fff; text-align:center; padding:8px 0; text-decoration:none; font-size:0.75rem; font-weight:800; text-transform:uppercase; border-radius:2px;">VIEW ITEM</a>
                <button onclick="removeWishlistItem('${handle}')" style="background:none; border:1px solid #ccc; padding:0 10px; cursor:pointer; border-radius:2px;">✕</button>
              </div>
            </div>
          </div>
        `;
      }).join('');
    }

    function removeWishlistItem(handle) {
      if (window.WishlistEngine) {
        WishlistEngine.toggle(handle);
      }
      loadWishlist();
    }

    function switchAccountTab(tab) {
      document.getElementById('tab-orders').classList.toggle('active', tab === 'orders');
      document.getElementById('tab-wishlist').classList.toggle('active', tab === 'wishlist');
      document.getElementById('section-orders').style.display = tab === 'orders' ? 'block' : 'none';
      document.getElementById('section-wishlist').style.display = tab === 'wishlist' ? 'block' : 'none';
    }

    if (document.readyState === 'loading') {
      document.addEventListener('DOMContentLoaded', initAccount);
    } else {
      initAccount();
    }
  </script>
</body>
</html>
